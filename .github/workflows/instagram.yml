name: Actualizar Instagram

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:          # botón para lanzarlo a mano

permissions:
  contents: write
  actions: write   # para lanzar "Publicar en GitHub Pages" cuando hay novedades

jobs:
  instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Vídeos de TikTok
        continue-on-error: true
        run: node scripts/tiktok.mjs
        env:
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}

      - name: Guardar el token de TikTok renovado
        if: hashFiles('.tt_token_nuevo') != ''
        run: |
          gh secret set TT_REFRESH_TOKEN < .tt_token_nuevo
          rm .tt_token_nuevo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Descargar publicaciones
        continue-on-error: true
        run: node scripts/instagram.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}

      - name: Guardar el token renovado
        if: hashFiles('.ig_token_nuevo') != ''
        run: |
          gh secret set IG_TOKEN < .ig_token_nuevo
          rm .ig_token_nuevo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Subir los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p public/instagram public/tiktok
          git add public/data public/tiktok public/instagram
          if git diff --cached --quiet; then
            echo "Sin publicaciones nuevas."
          else
            git commit -m "Actualizar Instagram y TikTok"
            git push
            # Lo que sube este workflow no lanza "Publicar" por sí solo: lo lanzamos a mano,
            # y solo cuando hay publicaciones nuevas.
            gh workflow run publicar.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
