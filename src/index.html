<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <script>
    // Antes de pintar: paleta guardada (o pastel) y modo guardado (o el del navegador).
    (function () {
      var r = document.documentElement, p = null, m = null;
      r.classList.add('js');
      try { p = localStorage.getItem('kt-cat-paleta'); m = localStorage.getItem('kt-cat-modo'); } catch (e) {}
      r.dataset.paleta = p === 'tierra' || p === 'blossom' ? p : 'pastel';
      r.dataset.modo = m === 'oscuro' || m === 'claro' ? m
        : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
    })();
  </script>
  <title>kt.cat</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crochet hecho a mano, casi todo en chenilla.">
  <meta name="theme-color" content="#f6f1ea">
  <link rel="alternate" hreflang="es" href="es">
  <link rel="alternate" hreflang="en" href="en">
  <link rel="alternate" hreflang="fr" href="fr">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

</body>
</html>
